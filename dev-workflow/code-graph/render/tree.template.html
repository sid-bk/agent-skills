<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Code Tree</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
:root { --bg: #f7f7f5; --panel: #ffffff; --border: #e2e2dd; --text: #1f2328; --muted: #6b6f76; --link: #c9c9c3; --accent: #2f6fdb; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #141517; --panel: #1c1d20; --border: #2e3035; --text: #e6e6e3; --muted: #9a9ea6; --link: #3a3c42; --accent: #6ea0ff; }
}
:root[data-theme="dark"] { --bg: #141517; --panel: #1c1d20; --border: #2e3035; --text: #e6e6e3; --muted: #9a9ea6; --link: #3a3c42; --accent: #6ea0ff; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; overflow: hidden; }
#bar { position: fixed; top: 0; left: 0; right: 0; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 10px 14px;
  background: var(--panel); border-bottom: 1px solid var(--border); z-index: 2; }
#bar h1 { font-size: 14px; margin: 0 10px 0 0; }
button { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 999px; padding: 4px 10px; font-size: 12px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 5px; }
button.active { border-color: var(--accent); color: var(--accent); }
button:disabled { opacity: 0.35; cursor: default; }
button i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
#hint { margin-left: auto; color: var(--muted); font-size: 12px; }
svg { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }
.link { fill: none; stroke: var(--link); stroke-width: 1.2px; }
.node circle { stroke-width: 1.5px; cursor: pointer; }
.node text { fill: var(--text); font-size: 12px; cursor: pointer; paint-order: stroke; stroke: var(--bg); stroke-width: 3px; }
.node .count { fill: var(--muted); font-size: 11px; }
#searchWrap { position: relative; }
#search { width: 280px; padding: 5px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); font-size: 12px; }
#search:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
#results { position: absolute; top: 32px; left: 0; width: 420px; max-height: 60vh; overflow-y: auto; background: var(--panel);
  border: 1px solid var(--border); border-radius: 6px; display: none; z-index: 3; box-shadow: 0 6px 20px rgba(0,0,0,.15); }
#results.open { display: block; }
.result { padding: 6px 10px; cursor: pointer; border-bottom: 1px solid var(--border); }
.result:hover, .result.active { background: var(--bg); }
.result .why { color: var(--muted); font-size: 11px; }
.node.found text.name { fill: var(--accent); font-weight: 700; }
.node.found circle { stroke-width: 3px; r: 6; }
#info { position: fixed; left: 14px; bottom: 14px; max-width: 520px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
  padding: 10px 12px; display: none; z-index: 2; }
#info code { font-size: 12px; word-break: break-all; }
#info .k { color: var(--muted); }
</style>
</head>
<body>
<div id="bar">
  <h1 id="title">Code Tree</h1>
  <span id="searchWrap"><input id="search" type="search" placeholder="Search symbols, files, clusters" autocomplete="off"><div id="results"></div></span>
  <span id="toggles"></span>
  <button id="collapseAll">Collapse all</button>
  <button id="fit">Fit</button>
  <span id="hint">Two-finger scroll to pan, pinch to zoom, click to expand</span>
</div>
<svg id="svg"><g id="viewport"><g id="links"></g><g id="nodes"></g></g></svg>
<div id="info"></div>
<script>
const D = /*__CODE_GRAPH_DATA__*/null;
const CATEGORY_COLORS = { Frontend: "#4E79A7", Backend: "#E8833A", Tests: "#59A14F", Tooling: "#B07AA1", External: "#9C9C9C", Other: "#76B7B2" };
const KIND_LABEL = { file: "file", class: "class", function: "fn", method: "method", symbol: "var", external: "ext" };
const ROW = 22, COLUMN = 230, DURATION = 450;
const $ = (id) => document.getElementById(id);

/* Hierarchy: project > category > folders (single-child chains merged) > file > symbols */
function buildHierarchy() {
  const root = { name: D.project, children: [] };
  const byCategory = {};
  D.nodes.forEach((n, i) => {
    const category = (byCategory[n.category] = byCategory[n.category] || { name: n.category, category: n.category, kids: {} });
    const parts = n.file ? n.file.split("/") : ["(external)"];
    let level = category;
    parts.forEach((part, depth) => {
      const isFile = depth === parts.length - 1;
      level.kids[part] = level.kids[part] || { name: part, category: n.category, kids: {}, symbols: [], isFile };
      level = level.kids[part];
    });
    if (n.kind !== "file") level.symbols.push(i);
  });
  const convert = (entry) => {
    let node = entry;
    while (!node.isFile && !(node.symbols || []).length && Object.keys(node.kids).length === 1 && !Object.values(node.kids)[0].isFile) {
      const child = Object.values(node.kids)[0];
      node = { ...child, name: node.name + "/" + child.name };
    }
    const children = Object.values(node.kids).sort((a, b) => (a.isFile - b.isFile) || a.name.localeCompare(b.name)).map(convert);
    const symbols = (node.symbols || []).sort((a, b) => (D.nodes[a].line || 0) - (D.nodes[b].line || 0))
      .map((i) => ({ name: D.nodes[i].label, category: node.category, nodeIndex: i }));
    return { name: node.name, category: node.category, isFile: node.isFile, children: children.concat(symbols) };
  };
  D.categories.forEach((cat) => {
    if (!byCategory[cat]) return;
    const entry = byCategory[cat];
    const children = Object.values(entry.kids).sort((a, b) => (a.isFile - b.isFile) || a.name.localeCompare(b.name)).map(convert);
    root.children.push({ name: cat, category: cat, isCategory: true, children });
  });
  return root;
}

const root = d3.hierarchy(buildHierarchy());
root.descendants().forEach((d) => {
  d.id = d.ancestors().map((a) => a.data.name).reverse().join("/") + (d.data.nodeIndex !== undefined ? "#" + d.data.nodeIndex : "");
  d.leafCount = d.leaves().filter((l) => l.data.nodeIndex !== undefined).length;
  d._children = d.children;
  if (d.depth > 0) d.children = null;
});
root.x0 = 0; root.y0 = 0;
let foundId = null;

const svg = d3.select("#svg"), viewport = d3.select("#viewport");
const layout = d3.tree().nodeSize([ROW, COLUMN]).separation((a, b) => (a.parent === b.parent ? 1 : 1.3));
const zoom = d3.zoom().scaleExtent([0.08, 3])
  .filter((event) => event.type !== "wheel" && event.type !== "dblclick" && !event.button)
  .on("zoom", (event) => viewport.attr("transform", event.transform));
svg.call(zoom);

/* Trackpad: two-finger scroll pans, pinch (ctrlKey wheel, or Safari gesture events) zooms */
svg.on("wheel", (event) => {
  event.preventDefault();
  const k = d3.zoomTransform(svg.node()).k;
  if (event.ctrlKey) zoom.scaleBy(svg, Math.pow(2, -event.deltaY * 0.01), d3.pointer(event));
  else zoom.translateBy(svg, -event.deltaX / k, -event.deltaY / k);
}, { passive: false });
let gestureStart = 1;
document.addEventListener("gesturestart", (e) => { e.preventDefault(); gestureStart = d3.zoomTransform(svg.node()).k; });
document.addEventListener("gesturechange", (e) => {
  e.preventDefault();
  zoom.scaleTo(svg, gestureStart * e.scale, [e.clientX, e.clientY]);
});

function color(d) { return CATEGORY_COLORS[d.data.category] || CATEGORY_COLORS.Other; }
function label(d) {
  if (d.data.nodeIndex !== undefined) { const n = D.nodes[d.data.nodeIndex]; return n.label; }
  return d.data.name;
}
function countLabel(d) {
  if (d.data.nodeIndex !== undefined) { const n = D.nodes[d.data.nodeIndex]; return KIND_LABEL[n.kind] + (n.line ? " :" + n.line : ""); }
  return d.leafCount ? String(d.leafCount) : "";
}

function update(source, centerOn) {
  layout(root);
  const nodes = root.descendants(), links = root.links();
  const node = d3.select("#nodes").selectAll("g.node").data(nodes, (d) => d.id);
  const entering = node.enter().append("g").attr("class", "node")
    .attr("transform", () => `translate(${source.y0},${source.x0})`)
    .on("click", (event, d) => clicked(d));
  entering.append("circle").attr("r", (d) => (d.data.nodeIndex !== undefined ? 3.5 : 5.5));
  entering.append("text").attr("class", "name").attr("dy", "0.32em");
  entering.append("text").attr("class", "count").attr("dy", "0.32em");
  const merged = entering.merge(node);
  merged.transition().duration(DURATION).attr("transform", (d) => `translate(${d.y},${d.x})`);
  merged.classed("found", (d) => d.id === foundId);
  merged.select("circle")
    .attr("fill", (d) => (d._children && !d.children ? color(d) : "var(--bg)"))
    .attr("stroke", color);
  merged.select("text.name").attr("x", 9).text(label);
  merged.each(function (d) {
    const name = this.querySelector("text.name");
    d3.select(this).select("text.count").attr("x", 14 + name.getComputedTextLength()).text(countLabel(d));
  });
  node.exit().transition().duration(DURATION).attr("transform", () => `translate(${source.y},${source.x})`).remove();

  const link = d3.select("#links").selectAll("path.link").data(links, (d) => d.target.id);
  const diagonal = d3.linkHorizontal().x((d) => d.y).y((d) => d.x);
  link.enter().append("path").attr("class", "link")
    .attr("d", () => { const o = { x: source.x0, y: source.y0 }; return diagonal({ source: o, target: o }); })
    .merge(link).transition().duration(DURATION).attr("d", diagonal);
  link.exit().transition().duration(DURATION)
    .attr("d", () => { const o = { x: source.x, y: source.y }; return diagonal({ source: o, target: o }); }).remove();

  nodes.forEach((d) => { d.x0 = d.x; d.y0 = d.y; });
  if (centerOn) centerView(centerOn);
}

/* Fit the expanded node and its visible children into the view */
function centerView(d) {
  const box = [d].concat(d.children || []);
  const xs = box.map((n) => n.x), ys = box.map((n) => n.y);
  const minX = Math.min(...xs) - ROW, maxX = Math.max(...xs) + ROW;
  const minY = Math.min(...ys) - 20, maxY = Math.max(...ys) + COLUMN;
  const width = svg.node().clientWidth, height = svg.node().clientHeight - 50;
  const k = Math.max(0.15, Math.min(1.4, Math.min(width / (maxY - minY), height / (maxX - minX))));
  const tx = width / 2 - k * (minY + maxY) / 2, ty = 50 + height / 2 - k * (minX + maxX) / 2;
  svg.transition().duration(DURATION + 150).call(zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(k));
}

function clicked(d) {
  if (d.data.nodeIndex !== undefined) return showInfo(d.data.nodeIndex);
  if (d.children) { d.children = null; update(d, d.parent || d); return; }
  d.children = d._children;
  update(d, d);
}

function collapse(d) { if (d._children) { d._children.forEach(collapse); } if (d.depth > 0) d.children = null; }
function expandSection(category) {
  root.children = root._children;
  root.children.forEach((c) => {
    collapse(c);
    if (c.data.name === category) {
      c.children = c._children;
      (c.children || []).forEach((child) => { if (child._children && child._children.length <= 12) child.children = child._children; });
    }
  });
  update(root, root.children.find((c) => c.data.name === category));
  document.querySelectorAll("#toggles button").forEach((b) => b.classList.toggle("active", b.dataset.category === category));
}

function showInfo(i) {
  const n = D.nodes[i], c = D.clusters[n.cluster] || {};
  const location = n.file ? `${D.target}/${n.file}${n.line ? ":" + n.line : ""}` : "";
  const info = $("info");
  info.style.display = "block";
  info.innerHTML = `<b>${n.label}</b> <span class="k">${KIND_LABEL[n.kind]}</span><br>` +
    (n.file ? `<code>${n.file}${n.line ? ":" + n.line : ""}</code> <button id="copy">Copy zed command</button><br>` : "External dependency<br>") +
    `<span class="k">Cluster: ${c.name || ""}</span>`;
  const copy = $("copy");
  if (copy) copy.onclick = () => { navigator.clipboard.writeText(`zed "${location}"`); copy.textContent = "Copied"; };
}

/* Search: expand the tree down to the chosen node, centre on it and highlight it */
/*__SEARCH_JS__*/
const runSearch = createSearch(D);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const symbolNodes = {}, fileNodes = {};
root.descendants().forEach((d) => {
  if (d.data.nodeIndex !== undefined) symbolNodes[d.data.nodeIndex] = d;
  else if (d.data.isFile) fileNodes[d.ancestors().reverse().slice(2).map((a) => a.data.name).join("/")] = d;
});
function reveal(i) {
  const n = D.nodes[i];
  const target = n.kind === "file" ? fileNodes[n.file] : symbolNodes[i];
  if (!target) return;
  target.ancestors().reverse().forEach((a) => { if (a !== target && !a.children && a._children) a.children = a._children; });
  foundId = target.id;
  update(target.parent || target, null);
  centerView(target);
  showInfo(i);
}
function showResults(query) {
  const results = runSearch(query);
  const box = $("results");
  box.innerHTML = results.slice(0, 50).map(([, i, why]) => {
    const n = D.nodes[i], c = D.clusters[n.cluster] || {};
    const note = why === "cluster" || why === "description" ? `cluster: ${esc(c.name || "")}` : esc(n.file || "external");
    return `<div class="result" data-node="${i}"><b>${esc(n.label)}</b> <span class="why">${KIND_LABEL[n.kind]}${n.line ? " :" + n.line : ""}</span><div class="why">${note}</div></div>`;
  }).join("") || (query.trim() ? `<div class="result why">No matches</div>` : "");
  if (results.length > 50) box.innerHTML += `<div class="result why">${results.length - 50} more; refine the search</div>`;
  box.classList.toggle("open", query.trim().length > 0);
}
let searchTimer = null;
$("search").addEventListener("input", (e) => { clearTimeout(searchTimer); searchTimer = setTimeout(() => showResults(e.target.value), 150); });
$("search").addEventListener("keydown", (e) => {
  if (e.key === "Enter") { const first = document.querySelector(".result[data-node]"); if (first) first.click(); }
  if (e.key === "Escape") { e.target.value = ""; showResults(""); }
});
$("results").addEventListener("click", (e) => {
  const row = e.target.closest("[data-node]");
  if (!row) return;
  document.querySelectorAll(".result.active").forEach((x) => x.classList.remove("active"));
  row.classList.add("active");
  reveal(+row.dataset.node);
});
document.addEventListener("click", (e) => { if (!e.target.closest("#searchWrap")) $("results").classList.remove("open"); });
$("search").addEventListener("focus", (e) => { if (e.target.value.trim()) $("results").classList.add("open"); });

const counts = {};
D.nodes.forEach((n) => { counts[n.category] = (counts[n.category] || 0) + 1; });
D.categories.forEach((cat) => {
  const b = document.createElement("button");
  b.dataset.category = cat;
  b.innerHTML = `<i style="background:${CATEGORY_COLORS[cat]}"></i>${cat}`;
  if (!counts[cat]) { b.disabled = true; b.title = cat === "Tests" ? "Excluded at build time. Rebuild with --include tests." : "None in this graph"; }
  b.onclick = () => expandSection(cat);
  $("toggles").appendChild(b);
});
$("collapseAll").onclick = () => { root.children = root._children; root.children.forEach(collapse); update(root, root);
  document.querySelectorAll("#toggles button").forEach((b) => b.classList.remove("active")); };
$("fit").onclick = () => centerView(root);

$("title").textContent = D.project;
document.title = D.project + " - Code Tree";
root.children = root._children;
update(root, root);
</script>
</body>
</html>
